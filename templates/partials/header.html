<!-- templates/partials/header.html -->
<header class="header">
    <div class="container">
        <div class="header-content">
            <div class="logo">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Ecoa - Eleva, cultiva y repite">
            </div>
            <nav class="nav-menu">
                <ul>
                    <li><a href="{{ url_for('index') }}" class="nav-link">Inicio</a></li>
                    <li><a href="{{ url_for('products') }}" class="nav-link">Macetas</a></li>
                    <li><a href="{{ url_for('about') }}" class="nav-link">Acerca de</a></li>
                    <li><a href="{{ url_for('contact') }}" class="nav-link">Contacto</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <!-- Carrito -->
                <a href="{{ url_for('cart') }}" class="icon-btn cart-btn">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">{{ session.cart|length or 0 }}</span>
                </a>

                <!-- Usuario NO logueado -->
                {% if not session.user_name %}
                    <a href="{{ url_for('login') }}" class="icon-btn icon-user-login" title="Iniciar Sesión">
                        <i class="fas fa-user"></i>
                    </a>
                {% else %}
                    <!-- Usuario logueado -->
                    <a href="{{ url_for('perfect_plant') }}" class="btn btn-small btn-plant">Tu Planta Ideal</a>
                    <a href="{{ url_for('logout') }}" class="icon-btn icon-logout" title="Cerrar Sesión">
                        <i class="fas fa-sign-out-alt"></i>
                    </a>
                {% endif %}

                <button class="menu-toggle" aria-label="Menú móvil">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </div>
</header>
